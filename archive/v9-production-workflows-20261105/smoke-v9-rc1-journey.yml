name: Full V9 RC1 comparison browser journey
on:
  push:
    paths:
      - "tests/runtime-browser-journey.mjs"
      - ".github/workflows/smoke-v9-rc1-journey.yml"
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  journey:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Reuse successful pinned RC1 package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist/v9-2026-09-30-r8
          gh run download 36736001077 --repo yass3705/tesla-charge-companion-production --name tcc-v9-2026-09-30-r8-candidate --dir dist/v9-2026-09-30-r8
      - run: npm install --no-save --no-package-lock playwright@1.55.1
      - name: Serve frozen preview without deployment
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 --directory dist/v9-2026-09-30-r8 >/tmp/tcc-journey-server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/v9-production-shell/shell-config.json >/dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Run geocoding/routing mocked real Chrome comparison
        run: node tests/runtime-browser-journey.mjs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: v9-rc1-journey-server-log
          path: /tmp/tcc-journey-server.log
          retention-days: 7
