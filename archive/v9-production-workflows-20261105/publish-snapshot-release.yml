name: Publish immutable V9 snapshot release

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production
        uses: actions/checkout@v4
        with:
          path: production

      - name: Read pinned snapshot metadata
        id: meta
        shell: bash
        run: |
          python production/scripts/export_snapshot_meta.py production/config/snapshots/2026-09-30.json >> "$GITHUB_OUTPUT"

      - name: Checkout pinned stable baseline
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.meta.outputs.stable_repo }}
          ref: ${{ steps.meta.outputs.stable_sha }}
          path: stable
          persist-credentials: false

      - name: Checkout pinned Data Lab
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.meta.outputs.datalab_repo }}
          ref: ${{ steps.meta.outputs.datalab_sha }}
          path: datalab
          persist-credentials: false

      - name: Download pinned Germany national baseline
        env:
          GH_TOKEN: ${{ github.token }}
          ART_REPO: ${{ steps.meta.outputs.germany_artifact_repo }}
          ART_ID: ${{ steps.meta.outputs.germany_artifact_id }}
        run: |
          gh api "/repos/$ART_REPO/actions/artifacts/$ART_ID/zip" > /tmp/germany.zip
          mkdir -p germany-source
          unzip -q /tmp/germany.zip -d germany-source

      - name: Build and validate immutable snapshot
        env:
          SNAPSHOT_ID: ${{ steps.meta.outputs.snapshot_id }}
        run: |
          cd production
          python scripts/validate_snapshot.py "config/snapshots/$SNAPSHOT_ID.json"
          python scripts/build_snapshot.py             --stable ../stable             --datalab ../datalab             --germany-source ../germany-source             --config "config/snapshots/$SNAPSHOT_ID.json"             --out "../dist/v9-$SNAPSHOT_ID"
          python scripts/validate_built_snapshot.py "../dist/v9-$SNAPSHOT_ID"
          python scripts/validate_stable_parity.py ../stable "../dist/v9-$SNAPSHOT_ID"

      - name: Verify existing immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          SNAPSHOT_ID: ${{ steps.meta.outputs.snapshot_id }}
        run: |
          TAG="v9-snapshot-$SNAPSHOT_ID"
          gh release view "$TAG" --repo yass3705/tesla-charge-companion-production >/dev/null
          echo "Persistent release $TAG already exists; no asset mutation performed."
