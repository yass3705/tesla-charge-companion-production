name: Inspect Atlante Italy smoke anchor

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/inspect-atlante-italy-smoke-anchor.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: yass3705/tesla-charge-companion-stable
          ref: 0a6d2c3415504397310d3dc92fae40be843b2435
          path: stable
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: yass3705/tesla-charge-companion-data-lab
          ref: d0996b493bcfee5312b5ca1e38070df87b0d9642
          path: datalab
          persist-credentials: false
      - name: Find exact EVSE overlap
        run: |
          python - <<'PY'
          import gzip,json,re
          with gzip.open("datalab/data/national/atlante_direct_stations_italy_latest.json.gz","rt",encoding="utf-8") as f:
              atl=json.load(f)
          with gzip.open("stable/v9-production-runtime/data/v9/italy-static/all.json.gz","rt",encoding="utf-8") as f:
              base=json.load(f)
          print("BASE_TYPE",type(base).__name__,"LEN",len(base) if hasattr(base,'__len__') else None)
          rows=base if isinstance(base,list) else base.get("stations",[]) if isinstance(base,dict) else []
          print("FIRST_ROW",json.dumps(rows[0] if rows else None,ensure_ascii=False)[:12000])

          # Index every string looking like an Italian EVSE/PDC, retaining its top-level station.
          idx={}
          def walk(x,station):
              if isinstance(x,str):
                  compact=re.sub(r'[^A-Z0-9]','',x.upper())
                  if compact.startswith("IT") and "E" in compact and len(compact)>=8:
                      idx.setdefault(x,station);idx.setdefault(compact,station)
              elif isinstance(x,list):
                  for v in x: walk(v,station)
              elif isinstance(x,dict):
                  for v in x.values(): walk(v,station)
          for r in rows:
              station={
                "stationId":r[0] if isinstance(r,list) and r else (r.get("id") if isinstance(r,dict) else None),
                "name":r[1] if isinstance(r,list) and len(r)>1 else (r.get("name") if isinstance(r,dict) else None),
                "lat":r[3] if isinstance(r,list) and len(r)>4 else (r.get("latitude") if isinstance(r,dict) else None),
                "lon":r[4] if isinstance(r,list) and len(r)>4 else (r.get("longitude") if isinstance(r,dict) else None),
              }
              walk(r,station)

          first=None
          for loc in atl.get("locations",[]):
              for c in loc.get("connectors",[]):
                  ev=str(c.get("evseId") or "")
                  compact=re.sub(r'[^A-Z0-9]','',ev.upper())
                  hit=idx.get(ev) or idx.get(compact)
                  if hit:
                      first={
                        "atlanteLocationId":loc.get("locationId") or loc.get("id"),
                        "atlanteName":loc.get("name"),
                        "atlanteCoordinates":loc.get("coordinates"),
                        "evseId":ev,
                        "pricePerKwhEur":c.get("pricePerKwhEur"),
                        **hit
                      }
                      break
              if first: break
          print(json.dumps({"indexedTokens":len(idx),"firstMatch":first},ensure_ascii=False,indent=2))
          assert first, "no exact Atlante EVSE overlap found"
          PY
