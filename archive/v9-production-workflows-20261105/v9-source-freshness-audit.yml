name: Read-only V9 source freshness audit
on:
  push:
    paths:
      - "scripts/inspect_v9_source_deltas.py"
      - "tests/test_v9_source_deltas.py"
      - ".github/workflows/v9-source-freshness-audit.yml"
      - "config/refresh-policy.json"
      - "config/snapshots/**"
  schedule:
    - cron: "23 23 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-deltas:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check guard classifications
        run: python -m unittest discover -s tests -p test_v9_source_deltas.py -v
      - name: Resolve the current pinned development snapshot
        id: pin
        run: |
          python - <<'PY'
          import json,os,pathlib
          policy=json.loads(pathlib.Path("config/refresh-policy.json").read_text())
          snap=policy["development"]["currentSnapshot"]
          config=pathlib.Path("config/snapshots")/(snap+".json")
          if not config.is_file():
              raise SystemExit("Pinned development snapshot not found: "+str(config))
          with open(os.environ["GITHUB_OUTPUT"],"a") as out:
              out.write("config="+str(config)+"\n")
          print("Auditing pinned snapshot:",config)
          PY
      - name: Compare Data Lab source blobs with current development pin
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python scripts/inspect_v9_source_deltas.py \
            --config "${{ steps.pin.outputs.config }}" \
            --output audit/v9-source-deltas.json \
            --summary audit/v9-source-summary.md
          cat audit/v9-source-summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: v9-readonly-source-delta-audit
          path: audit/
          retention-days: 14
