name: Publish V9 2026-09-30 r4 release

on:
  push:
    paths:
      - ".github/workflows/publish-2026-09-30-r4.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production
        uses: actions/checkout@v4
        with:
          path: production
      - name: Read r4 metadata
        id: meta
        run: python production/scripts/export_snapshot_meta.py production/config/snapshots/2026-09-30-r4.json >> "$GITHUB_OUTPUT"
      - name: Checkout pinned stable baseline
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.meta.outputs.stable_repo }}
          ref: ${{ steps.meta.outputs.stable_sha }}
          path: stable
          persist-credentials: false
      - name: Checkout safe Data Lab head
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.meta.outputs.datalab_repo }}
          ref: ${{ steps.meta.outputs.datalab_sha }}
          path: datalab
          persist-credentials: false
      - name: Guard AVIA Switzerland and Morocco native overlay
        run: |
          python - <<'PY'
          import json
          avia=json.load(open("datalab/docs/switzerland-avia-finalization-2026-09-29.json"))
          assert avia["coverage"]["resolvedNationalEvseCount"]==583
          assert avia["coverage"]["unresolvedNationalEvseCount"]==0
          te=json.load(open("datalab/reports/morocco/totalenergies/latest-native-overlay.json"))
          assert te["station_count"]==18
          assert te["summary"]["connectors_extracted"]==38
          assert te["summary"]["priced_connectors"]==38
          assert te["summary"]["live_status_200"]==38
          PY
      - name: Download pinned Germany national baseline
        env:
          GH_TOKEN: ${{ github.token }}
          ART_REPO: ${{ steps.meta.outputs.germany_artifact_repo }}
          ART_ID: ${{ steps.meta.outputs.germany_artifact_id }}
        run: |
          gh api "/repos/$ART_REPO/actions/artifacts/$ART_ID/zip" > /tmp/germany.zip
          mkdir -p germany-source
          unzip -q /tmp/germany.zip -d germany-source
      - name: Build and validate r4
        run: |
          cd production
          python scripts/validate_snapshot.py config/snapshots/2026-09-30-r4.json
          python scripts/build_snapshot.py             --stable ../stable             --datalab ../datalab             --germany-source ../germany-source             --config config/snapshots/2026-09-30-r4.json             --out ../dist/v9-2026-09-30-r4
          python scripts/validate_built_snapshot.py ../dist/v9-2026-09-30-r4 2026-09-30-r4
          python scripts/validate_stable_parity.py ../stable ../dist/v9-2026-09-30-r4
      - name: Package
        run: |
          cd dist
          zip -0 -r tcc-v9-snapshot-2026-09-30-r4.zip v9-2026-09-30-r4 >/dev/null
          sha256sum tcc-v9-snapshot-2026-09-30-r4.zip | tee tcc-v9-snapshot-2026-09-30-r4.sha256
      - name: Publish persistent r4 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v9-snapshot-2026-09-30-r4"
          ZIP="dist/tcc-v9-snapshot-2026-09-30-r4.zip"
          SUM="dist/tcc-v9-snapshot-2026-09-30-r4.sha256"
          cat > /tmp/notes.md <<'EOF'
          Validated revision 4 of Tesla Charge Companion V9 snapshot 2026-09-30.

          Additions since r3:
          - Morocco canonical CPO progress ledger added.
          - TotalEnergies Morocco native guest overlay added: 18 stations, 38 connectors, 38 explicit priced connectors and 38 live-status responses.
          - AVIA Switzerland source regression protection retained and accepted 583/583 coverage verified.
          - Fresh Atlante France/Italy and Electroverse France overlays retained.
          - Stable parity guard passed.

          Previous releases remain preserved as rollback points.
          EOF
          if gh release view "$TAG" --repo yass3705/tesla-charge-companion-production >/dev/null 2>&1; then
            echo "Release already exists; refusing to mutate it."
            exit 0
          fi
          gh release create "$TAG" "$ZIP" "$SUM"             --repo yass3705/tesla-charge-companion-production             --title "TCC V9 snapshot — 2026-09-30 r4"             --notes-file /tmp/notes.md             --target "$GITHUB_SHA"
