name: Publish immutable V9 snapshot release

on:
  push:
    paths:
      - ".github/workflows/publish-snapshot-release.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production
        uses: actions/checkout@v4
        with:
          path: production

      - name: Checkout pinned stable baseline
        uses: actions/checkout@v4
        with:
          repository: yass3705/tesla-charge-companion-stable
          ref: 0a6d2c3415504397310d3dc92fae40be843b2435
          path: stable
          persist-credentials: false

      - name: Checkout pinned Data Lab
        uses: actions/checkout@v4
        with:
          repository: yass3705/tesla-charge-companion-data-lab
          ref: d65546e28240d882bca34a9b177b4622669577c1
          path: datalab
          persist-credentials: false

      - name: Download pinned Germany national baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api /repos/yass3705/tesla-charge-companion-data-lab/actions/artifacts/9866595035/zip > /tmp/germany.zip
          mkdir -p germany-source
          unzip -q /tmp/germany.zip -d germany-source
          test -s germany-source/germany_non_tesla_catalog_staging_direct_cpo.json.gz
          test -s germany-source/germany_non_tesla_catalog_staging_direct_cpo_manifest.json

      - name: Build and validate immutable snapshot
        run: |
          cd production
          python scripts/validate_snapshot.py config/snapshots/2026-09-30.json
          python scripts/build_snapshot.py             --stable ../stable             --datalab ../datalab             --germany-source ../germany-source             --out ../dist/v9-2026-09-30
          python scripts/validate_built_snapshot.py ../dist/v9-2026-09-30
          python scripts/validate_stable_parity.py ../stable ../dist/v9-2026-09-30

      - name: Package release asset
        run: |
          cd dist
          zip -0 -r tcc-v9-snapshot-2026-09-30.zip v9-2026-09-30 >/dev/null
          sha256sum tcc-v9-snapshot-2026-09-30.zip | tee tcc-v9-snapshot-2026-09-30.sha256

      - name: Create release notes
        run: |
          cat > /tmp/release-notes.md <<'EOF'
          Immutable Tesla Charge Companion V9 baseline for 2026-09-30.

          Scope:
          - Tesla
          - Spain (ES)
          - Netherlands (NL)
          - Switzerland (CH)
          - Morocco (MA)
          - France (FR)
          - Italy (IT)
          - Germany (DE)
          - United Kingdom (UK)

          Policy: fail-closed for unresolved tariffs and identities.

          Pinned inputs:
          - Data Lab: d65546e28240d882bca34a9b177b4622669577c1
          - Stable baseline: 0a6d2c3415504397310d3dc92fae40be843b2435
          - Germany recovery ledger: 59573b851fd9ee015f6edac6a9302b07e09cc71e
          - Germany national artifact: 9866595035

          Validation:
          - 9 datasets
          - UK first pass complete
          - DE 63,405 non-Tesla sites / 591 named CPOs
          - stable parity guard passed
          - multi-country runtime contract passed
          EOF

      - name: Publish persistent GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v9-snapshot-2026-09-30"
          ZIP="dist/tcc-v9-snapshot-2026-09-30.zip"
          SUM="dist/tcc-v9-snapshot-2026-09-30.sha256"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ZIP" "$SUM" --clobber
          else
            gh release create "$TAG" "$ZIP" "$SUM"               --title "TCC V9 snapshot — 2026-09-30"               --notes-file /tmp/release-notes.md               --target "$GITHUB_SHA"
          fi
