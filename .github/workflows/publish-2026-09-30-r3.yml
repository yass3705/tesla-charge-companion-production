name: Publish V9 2026-09-30 r3 release

on:
  push:
    paths:
      - ".github/workflows/publish-2026-09-30-r3.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production
        uses: actions/checkout@v4
        with:
          path: production
      - name: Read r3 metadata
        id: meta
        run: python production/scripts/export_snapshot_meta.py production/config/snapshots/2026-09-30-r3.json >> "$GITHUB_OUTPUT"
      - name: Checkout pinned stable baseline
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.meta.outputs.stable_repo }}
          ref: ${{ steps.meta.outputs.stable_sha }}
          path: stable
          persist-credentials: false
      - name: Checkout safe Data Lab commit
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.meta.outputs.datalab_repo }}
          ref: ${{ steps.meta.outputs.datalab_sha }}
          path: datalab
          persist-credentials: false
      - name: Guard finalized Switzerland
        run: |
          python - <<'PY'
          import json
          d=json.load(open("datalab/docs/switzerland-avia-finalization-2026-09-29.json"))
          c=d["coverage"]
          assert d["status"]=="complete"
          assert c["resolvedNationalEvseCount"]==583
          assert c["unresolvedNationalEvseCount"]==0
          PY
      - name: Download pinned Germany national baseline
        env:
          GH_TOKEN: ${{ github.token }}
          ART_REPO: ${{ steps.meta.outputs.germany_artifact_repo }}
          ART_ID: ${{ steps.meta.outputs.germany_artifact_id }}
        run: |
          gh api "/repos/$ART_REPO/actions/artifacts/$ART_ID/zip" > /tmp/germany.zip
          mkdir -p germany-source
          unzip -q /tmp/germany.zip -d germany-source
      - name: Build and validate r3
        run: |
          cd production
          python scripts/validate_snapshot.py config/snapshots/2026-09-30-r3.json
          python scripts/build_snapshot.py             --stable ../stable             --datalab ../datalab             --germany-source ../germany-source             --config config/snapshots/2026-09-30-r3.json             --out ../dist/v9-2026-09-30-r3
          python scripts/validate_built_snapshot.py ../dist/v9-2026-09-30-r3 2026-09-30-r3
          python scripts/validate_stable_parity.py ../stable ../dist/v9-2026-09-30-r3
      - name: Package
        run: |
          cd dist
          zip -0 -r tcc-v9-snapshot-2026-09-30-r3.zip v9-2026-09-30-r3 >/dev/null
          sha256sum tcc-v9-snapshot-2026-09-30-r3.zip | tee tcc-v9-snapshot-2026-09-30-r3.sha256
      - name: Publish persistent r3 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v9-snapshot-2026-09-30-r3"
          ZIP="dist/tcc-v9-snapshot-2026-09-30-r3.zip"
          SUM="dist/tcc-v9-snapshot-2026-09-30-r3.sha256"
          cat > /tmp/notes.md <<'EOF'
          Validated revision 3 of Tesla Charge Companion V9 snapshot 2026-09-30.

          Additions since r2:
          - Fresh Atlante direct tariff snapshots: France 163 stations / 1,423 priced connectors; Italy 472 stations / 1,842 priced connectors.
          - Fresh Electroverse France inventory: 166,429 entries, zero failed tiles.
          - Explicit source-selection guard rejects the later transient AVIA Switzerland regression.
          - AVIA Switzerland finalized coverage remains 583/583 deterministic EVSEs.
          - Stable parity guard passed.

          r2 and the original 2026-09-30 release remain preserved as rollback points.
          EOF
          if gh release view "$TAG" --repo yass3705/tesla-charge-companion-production >/dev/null 2>&1; then
            echo "Release already exists; refusing to mutate it."
            exit 0
          fi
          gh release create "$TAG" "$ZIP" "$SUM"             --repo yass3705/tesla-charge-companion-production             --title "TCC V9 snapshot — 2026-09-30 r3"             --notes-file /tmp/notes.md             --target "$GITHUB_SHA"
