name: V9 compact filters and navigation Lot 2
on:
  pull_request:
    paths:
      - 'v9-production-shell/bridge.js'
      - 'tests/v9-compact-navigation-lot2.test.mjs'
      - 'tests/v9-compact-navigation-browser.mjs'
      - '.github/workflows/test-v9-compact-navigation-lot2.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compact-navigation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check v9-production-shell/bridge.js
      - run: node --test tests/v9-compact-navigation-lot2.test.mjs tests/v9-station-card-lot1.test.mjs tests/v9-shell-grouping.test.mjs tests/v9-tariff-lanes.test.mjs
      - run: npm install --no-save --no-package-lock playwright@1.55.1
      - run: node tests/v9-compact-navigation-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v9-lot2-browser-screenshots
          path: artifacts/lot2-*.png
          if-no-files-found: ignore
          retention-days: 14
