name: Build explicit V9 snapshot candidate

on:
  workflow_dispatch:
    inputs:
      snapshot_id:
        description: Immutable snapshot candidate id (for example 2026-10-01-r10)
        required: true
        type: string
      datalab_sha:
        description: Exact 40-char Data Lab commit SHA to pin
        required: true
        type: string
      use_datalab_nl:
        description: Use the DOT-NL national runtime from the pinned Data Lab commit
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: v9-explicit-snapshot-candidate
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          path: production
      - uses: actions/checkout@v4
        with:
          repository: yass3705/tesla-charge-companion-stable
          ref: 0a6d2c3415504397310d3dc92fae40be843b2435
          path: stable
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: yass3705/tesla-charge-companion-data-lab
          ref: ${{ inputs.datalab_sha }}
          path: datalab
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact requested Data Lab pin
        shell: bash
        run: |
          set -euo pipefail
          requested="${{ inputs.datalab_sha }}"
          requested="$(printf '%s' "$requested" | tr -d '[:space:]')"
          test "$(git -C datalab rev-parse HEAD)" = "$requested"

      - name: Generate immutable candidate config
        run: |
          snapshot_id="${{ inputs.snapshot_id }}"
          snapshot_id="$(printf '%s' "$snapshot_id" | tr -d '[:space:]')"
          echo "SNAPSHOT_ID=$snapshot_id" >> "$GITHUB_ENV"
          args=(
            --base production/config/snapshots/2026-09-30-r9-electra-fr.json
            --datalab-sha "${{ inputs.datalab_sha }}"
            --snapshot-id "$snapshot_id"
            --out production/config/snapshots/explicit-candidate.json
          )
          if [ "${{ inputs.use_datalab_nl }}" = "true" ]; then
            args+=(--use-datalab-nl)
          fi
          python production/scripts/build_refresh_candidate_config.py "${args[@]}"
          python production/scripts/validate_snapshot.py production/config/snapshots/explicit-candidate.json
          python production/scripts/validate_electra_platform_overlay.py datalab

      - name: Build and validate snapshot candidate
        run: |
          cd production
          python scripts/build_snapshot.py             --stable ../stable             --datalab ../datalab             --config config/snapshots/explicit-candidate.json             --out ../dist/v9-explicit-candidate
          python scripts/validate_built_snapshot.py ../dist/v9-explicit-candidate "$SNAPSHOT_ID"
          parity_args=(../stable ../dist/v9-explicit-candidate)
          if [ "${{ inputs.use_datalab_nl }}" = "true" ]; then
            parity_args+=(--allow-nl-override)
          fi
          python scripts/validate_stable_parity.py "${parity_args[@]}"
          python scripts/validate_browser_asset_graph.py ../dist/v9-explicit-candidate

      - name: V9 station grouping
        run: node production/tests/v9-shell-grouping.test.mjs

      - name: Electra Bois-d'Arcy tariff calculation
        run: node production/tests/electra-bois-darcy-direct.test.mjs dist/v9-explicit-candidate/runtime

      - name: IZIVIA FAST Dole tariff calculation
        run: node production/tests/izivia-fast-dole-direct.test.mjs dist/v9-explicit-candidate/runtime

      - name: Multi-country runtime smoke
        env:
          REQUIRE_ELECTRA_PLATFORM: "1"
        run: node production/tests/runtime-e2e-smoke.mjs dist/v9-explicit-candidate

      - name: Install browser test dependency
        run: npm install --no-save --no-package-lock playwright@1.55.1

      - name: Serve candidate locally
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 --directory dist/v9-explicit-candidate >/tmp/tcc-explicit-snapshot-server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/v9-production-shell/shell-config.json >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/tcc-explicit-snapshot-server.log
          exit 1

      - name: Mocked geocoding/routing browser journey
        run: node production/tests/runtime-browser-journey.mjs

      - name: Verify candidate manifest hashes
        run: python production/scripts/verify_candidate_manifest.py dist/v9-explicit-candidate

      - uses: actions/upload-artifact@v4
        with:
          name: v9-snapshot-candidate
          path: |
            dist/v9-explicit-candidate
            production/config/snapshots/explicit-candidate.json
          retention-days: 14
          compression-level: 0

      - name: Explicit no-publish guard
        run: echo "Validated immutable snapshot candidate only. No release, tag, deployment or development-pin change is performed."
