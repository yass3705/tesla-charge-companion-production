name: Temporary V9 iPhone preview

on:
  push:
    branches:
      - v9/interface-foundation-frozen-snapshot
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: v9-iphone-preview
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout production
        uses: actions/checkout@v4
        with:
          path: production

      - name: Checkout stable baseline
        uses: actions/checkout@v4
        with:
          repository: yass3705/tesla-charge-companion-stable
          ref: e3848a6b37310c10d5e1827a7c947ef296d7e746
          path: stable
          persist-credentials: false

      - name: Checkout pinned Data Lab snapshot
        uses: actions/checkout@v4
        with:
          repository: yass3705/tesla-charge-companion-data-lab
          ref: 7f5a4f69da8fb75e8fcf3d20dc413ff54e36c595
          path: datalab
          fetch-depth: 1
          persist-credentials: false

      - name: Build immutable preview candidate
        env:
          SNAPSHOT_ID: 2026-10-04-r12-full-national
          DATALAB_SHA: 7f5a4f69da8fb75e8fcf3d20dc413ff54e36c595
        run: |
          set -euo pipefail
          test "$(git -C datalab rev-parse HEAD)" = "$DATALAB_SHA"
          python production/scripts/build_refresh_candidate_config.py \
            --base production/config/snapshots/2026-10-04-r12-full-national.json \
            --datalab-sha "$DATALAB_SHA" \
            --snapshot-id "$SNAPSHOT_ID" \
            --out production/config/snapshots/explicit-candidate.json
          python production/scripts/validate_snapshot.py production/config/snapshots/explicit-candidate.json
          python production/scripts/validate_electra_platform_overlay.py datalab
          python production/scripts/build_snapshot.py \
            --stable stable \
            --datalab datalab \
            --config production/config/snapshots/explicit-candidate.json \
            --out dist/v9-explicit-candidate
          python production/scripts/validate_built_snapshot.py dist/v9-explicit-candidate "$SNAPSHOT_ID"
          python production/scripts/validate_stable_parity.py stable dist/v9-explicit-candidate --allow-pricing-engine-override --allow-tesla-override
          python production/scripts/validate_browser_asset_graph.py dist/v9-explicit-candidate
          python production/scripts/verify_candidate_manifest.py dist/v9-explicit-candidate

      - name: Multi-country runtime smoke
        env:
          REQUIRE_ELECTRA_PLATFORM: "1"
        run: node production/tests/runtime-e2e-smoke.mjs dist/v9-explicit-candidate

      - name: Install browser test dependency
        run: npm install --no-save --no-package-lock playwright@1.55.1

      - name: Serve candidate locally
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 --directory dist/v9-explicit-candidate >/tmp/tcc-v9-preview-server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/v9-production-shell/shell-config.json >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/tcc-v9-preview-server.log
          exit 1

      - name: Mocked geocoding and routing browser journey
        run: node production/tests/runtime-browser-journey.mjs

      - name: Verify candidate manifest hashes
        run: python production/scripts/verify_candidate_manifest.py dist/v9-explicit-candidate

      # Prepare the Pages destination before uploading the frozen preview.
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload V9 preview
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/v9-explicit-candidate

      - name: Deploy V9 preview
        id: deployment
        uses: actions/deploy-pages@v4
