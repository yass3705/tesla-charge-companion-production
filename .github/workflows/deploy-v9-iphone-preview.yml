name: Temporary V9 preview

on:
  push:
    branches:
      - v9/interface-foundation-frozen-snapshot
    paths:
      - .github/workflows/deploy-v9-iphone-preview.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: v9-iphone-preview
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout reviewed production candidate
        uses: actions/checkout@v4
        with:
          ref: c14db657fd8ed77ea124e8cea04c580397a6d22d
          path: production

      - name: Checkout stable baseline
        uses: actions/checkout@v4
        with:
          repository: yass3705/tesla-charge-companion-stable
          ref: 0a6d2c3415504397310d3dc92fae40be843b2435
          path: stable
          persist-credentials: false

      - name: Checkout pinned Data Lab
        uses: actions/checkout@v4
        with:
          repository: yass3705/tesla-charge-companion-data-lab
          ref: cdf55254f6ce72f67db38349d4a639ff81bcc359
          path: datalab
          fetch-depth: 1
          persist-credentials: false

      - name: Verify pins and build preview candidate
        env:
          SNAPSHOT_ID: 2026-10-06-pr17-all-tariff-profiles-preview
        run: |
          set -euo pipefail
          test "$(git -C production rev-parse HEAD)" = c14db657fd8ed77ea124e8cea04c580397a6d22d
          test "$(git -C stable rev-parse HEAD)" = 0a6d2c3415504397310d3dc92fae40be843b2435
          test "$(git -C datalab rev-parse HEAD)" = cdf55254f6ce72f67db38349d4a639ff81bcc359
          python production/scripts/build_refresh_candidate_config.py \
            --base production/config/snapshots/2026-09-30-r9-electra-fr.json \
            --datalab-sha cdf55254f6ce72f67db38349d4a639ff81bcc359 \
            --snapshot-id "$SNAPSHOT_ID" \
            --out production/config/snapshots/explicit-candidate.json
          python production/scripts/validate_snapshot.py production/config/snapshots/explicit-candidate.json
          python production/scripts/validate_electra_platform_overlay.py datalab
          python production/tests/electra-weekday-direct.test.py
          python production/tests/electroverse-national-identity-bridge.test.py
          python production/scripts/build_snapshot.py \
            --stable stable --datalab datalab \
            --config production/config/snapshots/explicit-candidate.json \
            --out dist/v9-explicit-candidate
          python production/scripts/validate_built_snapshot.py dist/v9-explicit-candidate "$SNAPSHOT_ID"
          python production/scripts/validate_stable_parity.py stable dist/v9-explicit-candidate --allow-pricing-engine-override
          python production/scripts/audit_tariff_profiles.py dist/v9-explicit-candidate --output tariff-audit/profile-inventory.json --expected-profile-signatures 145
          python production/scripts/validate_browser_asset_graph.py dist/v9-explicit-candidate

      - name: Verify tariff calculations and grouping
        run: |
          set -euo pipefail
          node production/tests/pricing-rule-precedence.test.mjs dist/v9-explicit-candidate/runtime
          node production/tests/pricing-profile-matrix.test.mjs dist/v9-explicit-candidate/runtime
          node production/tests/pricing-profile-sweep.test.mjs dist/v9-explicit-candidate tariff-audit/profile-inventory.json
          node production/tests/v9-ui-contract.test.mjs
          node production/tests/v9-shell-grouping.test.mjs
          node production/tests/electroverse-complex-pricing.test.mjs dist/v9-explicit-candidate
          node production/tests/tariff-join-regression.test.mjs dist/v9-explicit-candidate/runtime
          node production/tests/electra-bois-darcy-direct.test.mjs dist/v9-explicit-candidate/runtime
          node production/tests/izivia-fast-dole-direct.test.mjs dist/v9-explicit-candidate/runtime
          node production/tests/izivia-fast-france-direct.test.mjs dist/v9-explicit-candidate/runtime

      - name: Multi-country runtime smoke
        env:
          REQUIRE_ELECTRA_PLATFORM: "1"
          REQUIRE_IZIVIA_FAST_DOLE: "1"
        run: node production/tests/runtime-e2e-smoke.mjs dist/v9-explicit-candidate

      - name: Install browser test dependency
        run: npm install --no-save --no-package-lock playwright@1.55.1

      - name: Serve candidate locally
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 --directory dist/v9-explicit-candidate >/tmp/tcc-v9-preview-server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/v9-production-shell/shell-config.json >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/tcc-v9-preview-server.log
          exit 1

      - name: Browser journey and manifest hashes
        run: |
          set -euo pipefail
          node production/tests/runtime-browser-journey.mjs
          python production/scripts/verify_candidate_manifest.py dist/v9-explicit-candidate

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload V9 preview
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/v9-explicit-candidate

      - name: Deploy V9 preview
        id: deployment
        uses: actions/deploy-pages@v4
