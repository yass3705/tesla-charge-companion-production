name: Deploy V9 global Mac preview
on:
  pull_request:
    paths:
      - ".github/workflows/deploy-v9-global-mac-preview.yml"
      - "v9-production-shell/bridge.js"
      - "tests/v9-shell-grouping.test.mjs"
      - "tests/runtime-browser-journey-global.mjs"
      - "scripts/build_refresh_candidate_config.py"
      - "scripts/build_snapshot.py"
      - "scripts/tesla_tariff_priority.py"
      - "scripts/validate_stable_parity.py"
      - "tests/test_tesla_tariff_priority.py"
      - "data/tesla_mac_country_updates.json"
      - "docs/tesla-mac-suc-comparison-2026-10-07.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-v9-global-mac-preview.yml"
      - "v9-production-shell/bridge.js"
      - "scripts/build_refresh_candidate_config.py"
      - "scripts/build_snapshot.py"
      - "scripts/tesla_tariff_priority.py"
      - "scripts/validate_stable_parity.py"
      - "tests/test_tesla_tariff_priority.py"
      - "docs/tesla-mac-suc-comparison-2026-10-07.json"
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:
    inputs:
      stable_sha:
        description: Exact Stable commit containing the Mac Tesla export
        required: false
        default: ''
      datalab_sha:
        description: Exact Data Lab commit for other current sources
        required: false
        default: ''
      snapshot_id:
        description: Optional unique V9 preview snapshot ID; blank uses the GitHub run ID
        required: false
        default: ''
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: v9-iphone-preview
  cancel-in-progress: true
jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Resolve exact pins
        id: pins
        env:
          STABLE_SHA_INPUT: ${{ inputs.stable_sha || '' }}
          DATALAB_SHA_INPUT: ${{ inputs.datalab_sha || '' }}
          SNAPSHOT_ID_INPUT: ${{ inputs.snapshot_id || '' }}
        shell: bash
        run: |
          set -euo pipefail
          # Refresh against current national bases on scheduled, push and pull_request runs.
          # Optional manual SHA pins allow an explicitly reproducible preview.
          if [[ "${{ github.event_name }}" != "workflow_dispatch" || -z "$STABLE_SHA_INPUT" ]]; then
            STABLE_SHA_INPUT="$(git ls-remote https://github.com/yass3705/tesla-charge-companion-stable.git refs/heads/main | cut -f1)"
          fi
          if [[ "${{ github.event_name }}" != "workflow_dispatch" || -z "$DATALAB_SHA_INPUT" ]]; then
            DATALAB_SHA_INPUT="$(git ls-remote https://github.com/yass3705/tesla-charge-companion-data-lab.git refs/heads/main | cut -f1)"
          fi
          if [[ -z "$SNAPSHOT_ID_INPUT" ]]; then
            SNAPSHOT_ID_INPUT="$(TZ=Europe/Paris date +%Y-%m-%d)-r${GITHUB_RUN_ID}"
          fi
          [[ "$STABLE_SHA_INPUT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$DATALAB_SHA_INPUT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SNAPSHOT_ID_INPUT" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}-r[0-9]+$ ]]
          echo "stable_sha=$STABLE_SHA_INPUT" >> "$GITHUB_OUTPUT"
          echo "datalab_sha=$DATALAB_SHA_INPUT" >> "$GITHUB_OUTPUT"
          echo "snapshot_id=$SNAPSHOT_ID_INPUT" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          path: production
      - uses: actions/checkout@v4
        with:
          repository: yass3705/tesla-charge-companion-stable
          ref: ${{ steps.pins.outputs.stable_sha }}
          path: stable
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: yass3705/tesla-charge-companion-data-lab
          ref: ${{ steps.pins.outputs.datalab_sha }}
          path: datalab
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify fresh UK Ubitricity direct PAYG input before publication
        shell: bash
        run: |
          set -euo pipefail
          node production/tests/uk-ubitricity-integration.test.mjs datalab/data/national/uk_ubitricity_v9.json.gz
          python - <<'PY'
          import gzip, json
          from datetime import datetime, timezone, timedelta
          from pathlib import Path
          root = Path('datalab')
          report = json.loads((root/'reports/uk/ubitricity-pcpr-validation-latest.json').read_text())
          with gzip.open(root/'data/national/uk_ubitricity_v9.json.gz', 'rt') as fh:
              payload = json.load(fh)
          assert report['status'] == 'validated_runtime_input_ready', report['status']
          assert report['collectedAt'] == payload['collectedAt']
          assert datetime.now(timezone.utc) - datetime.fromisoformat(report['collectedAt']) <= timedelta(hours=48), 'Ubitricity input older than 48h'
          assert report['countries'] == {'GBR': report['locations']}
          assert report['locations'] >= 10000 and report['pricedConnectors'] >= 13000, 'Ubitricity coverage unexpectedly dropped'
          assert report['pricedConnectors'] + report['unpricedConnectors'] == report['connectors']
          assert report['unpricedConnectors'] >= 0
          assert payload['sources'][0]['pricingScope'] == 'cpo_direct_payg_verified'
          print('Validated UK Ubitricity input:', {k:report[k] for k in ('locations','connectors','pricedConnectors','unpricedConnectors')})
          PY
      - name: Build and validate current global preview
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C stable rev-parse HEAD)" = "${{ steps.pins.outputs.stable_sha }}"
          test "$(git -C datalab rev-parse HEAD)" = "${{ steps.pins.outputs.datalab_sha }}"
          python production/scripts/build_refresh_candidate_config.py \
            --base production/config/snapshots/2026-10-06-r14-complete-left-join.json \
            --stable-sha "${{ steps.pins.outputs.stable_sha }}" \
            --datalab-sha "${{ steps.pins.outputs.datalab_sha }}" \
            --snapshot-id "${{ steps.pins.outputs.snapshot_id }}" \
            --use-stable-tesla-data --use-country-tesla-priority --use-datalab-nl \
            --out production/config/snapshots/global-mac-preview.json
          python production/scripts/validate_snapshot.py production/config/snapshots/global-mac-preview.json
          python production/scripts/validate_electra_platform_overlay.py datalab
          python production/scripts/build_snapshot.py --stable stable --datalab datalab \
            --config production/config/snapshots/global-mac-preview.json --out dist/v9-global-preview
          python production/scripts/validate_built_snapshot.py dist/v9-global-preview "${{ steps.pins.outputs.snapshot_id }}"
          cmp dist/v9-global-preview/runtime/data/tesla_stations.json dist/v9-global-preview/data/tesla_stations.json
          python production/scripts/validate_stable_parity.py stable dist/v9-global-preview --allow-nl-override --allow-country-tesla-priority --allow-pricing-engine-override
          python -m unittest discover -s production/tests -p 'test_tesla_tariff_priority.py'
          python production/scripts/validate_browser_asset_graph.py dist/v9-global-preview
          python production/scripts/verify_candidate_manifest.py dist/v9-global-preview
      - name: Verify deployed V9 bundle contains exact UK Ubitricity input
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import gzip, hashlib, json
          from pathlib import Path
          dist = Path('dist/v9-global-preview')
          origin = Path('datalab/data/national/uk_ubitricity_v9.json.gz')
          deployed = dist/'snapshot-inputs/UK/sources/uk_ubitricity_v9.json.gz'
          assert deployed.exists(), 'Ubitricity feed absent from V9 bundle'
          assert hashlib.sha256(origin.read_bytes()).digest() == hashlib.sha256(deployed.read_bytes()).digest(), 'Ubitricity feed differs from validated Data Lab source'
          registry = json.loads((dist/'runtime/data/v9/source-registry.json').read_text())
          source = next(s for s in registry['sources'] if s.get('id')=='uk-ubitricity-pcpr-payg')
          assert source['active'] is True and source['optional'] is False
          assert source['path']=='../snapshot-inputs/UK/sources/uk_ubitricity_v9.json.gz'
          with gzip.open(deployed, 'rt') as fh: data=json.load(fh)
          report = json.loads(Path('datalab/reports/uk/ubitricity-pcpr-validation-latest.json').read_text())
          locs = data['sources'][0]['locations']
          priced = sum(bool(c.get('validatedV9Offer')) for loc in locs for e in loc.get('evses',[]) for c in e.get('connectors',[]))
          assert priced == report['pricedConnectors'] and len(locs)==report['locations'] and priced >= 13000
          print(f'V9 Ubitricity ready: {len(locs)} locations / {priced} validated direct connector offers; exact source digest matched')
          PY
      - name: Multi-country runtime smoke
        env:
          REQUIRE_ELECTRA_PLATFORM: "1"
        run: |
          node production/tests/v9-shell-grouping.test.mjs
          node production/tests/offer-identity-index.test.mjs dist/v9-global-preview
          node production/tests/runtime-e2e-smoke.mjs dist/v9-global-preview
          node production/tests/national-snapshot-smoke.mjs dist/v9-global-preview
          node production/tests/electroverse-rich-pricing.test.mjs dist/v9-global-preview
      - name: Install browser test dependency
        run: npm install --no-save --no-package-lock playwright@1.55.1
      - name: Serve preview locally
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 --directory dist/v9-global-preview >/tmp/tcc-global-preview-server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/v9-production-shell/shell-config.json >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/tcc-global-preview-server.log
          exit 1
      - name: Browser journey
        run: node production/tests/runtime-browser-journey-global.mjs
      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload V9 global preview
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/v9-global-preview
  deploy:
    if: github.event_name != 'pull_request'
    needs: build-deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy V9 global preview
        id: deployment
        uses: actions/deploy-pages@v4
