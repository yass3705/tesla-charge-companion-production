name: Deploy V9 global Mac preview
on:
  pull_request:
    paths:
      - ".github/workflows/deploy-v9-global-mac-preview.yml"
      - "v9-production-shell/bridge.js"
      - "tests/v9-shell-grouping.test.mjs"
      - "tests/v9-tariff-lanes.test.mjs"
      - "tests/v9-ocpi-component-coverage.test.mjs"
      - "tests/v9-congestion-soc80.test.mjs"
      - "tests/test_electra_direct_ocpi.py"
      - "scripts/build_electra_direct_offers.py"
      - "runtime-overrides/assets/v9/pricing-engine.js"
      - "runtime-overrides/assets/v9/session-engine.js"
      - "runtime-overrides/assets/v9/adapters/uk-open-feeds.js"
      - "runtime-overrides/assets/v9/adapters/atlante-italy-exact.js"
      - "tests/runtime-browser-journey-global.mjs"
      - "scripts/build_refresh_candidate_config.py"
      - "scripts/patch_ocpi_pcpr_pricing.py"
      - "tests/uk-ocpi-first-match.test.mjs"
      - "tests/v9-ocpi-component-coverage.test.mjs"
      - "tests/uk-eco-movement-pcpr-stage.test.mjs"
      - "runtime-overrides/assets/v9/adapters/uk-open-feeds.js"
      - "scripts/build_runtime_registry.py"
      - "scripts/build_snapshot.py"
      - "scripts/build_germany_ionity_inventory_supplement.py"
      - "scripts/validate_built_snapshot.py"
      - "tests/runtime-e2e-smoke.mjs"
      - "scripts/build_runtime_registry.py"
      - "scripts/validate_built_snapshot.py"
      - "runtime-overrides/assets/v9/adapters/uk-open-feeds.js"
      - "runtime-overrides/assets/v9/map-price-engine.js"
      - "tests/uk-gridserve-integration.test.mjs"
      - "scripts/tesla_tariff_priority.py"
      - "scripts/validate_stable_parity.py"
      - "tests/test_tesla_tariff_priority.py"
      - "data/tesla_mac_country_updates.json"
      - "docs/tesla-mac-suc-comparison-2026-10-07.json"
  push:
    branches: [main]
    paths:
      - "data/tesla_mac_country_updates.json"
      - ".github/workflows/deploy-v9-global-mac-preview.yml"
      - "v9-production-shell/bridge.js"
      - "runtime-overrides/assets/v9/pricing-engine.js"
      - "runtime-overrides/assets/v9/session-engine.js"
      - "scripts/build_electra_direct_offers.py"
      - "tests/v9-congestion-soc80.test.mjs"
      - "tests/runtime-browser-journey-global.mjs"
      - "scripts/build_refresh_candidate_config.py"
      - "scripts/patch_ocpi_pcpr_pricing.py"
      - "tests/uk-ocpi-first-match.test.mjs"
      - "tests/v9-ocpi-component-coverage.test.mjs"
      - "tests/uk-eco-movement-pcpr-stage.test.mjs"
      - "runtime-overrides/assets/v9/adapters/uk-open-feeds.js"
      - "scripts/build_runtime_registry.py"
      - "scripts/build_snapshot.py"
      - "scripts/build_germany_ionity_inventory_supplement.py"
      - "scripts/validate_built_snapshot.py"
      - "tests/runtime-e2e-smoke.mjs"
      - "scripts/tesla_tariff_priority.py"
      - "scripts/validate_stable_parity.py"
      - "tests/test_tesla_tariff_priority.py"
      - "docs/tesla-mac-suc-comparison-2026-10-07.json"
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:
    inputs:
      stable_sha:
        description: Exact Stable commit containing the Mac Tesla export
        required: false
        default: ''
      datalab_sha:
        description: Exact Data Lab commit for other current sources
        required: false
        default: ''
      snapshot_id:
        description: Optional unique V9 preview snapshot ID; blank uses the GitHub run ID
        required: false
        default: ''
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: v9-iphone-preview
  cancel-in-progress: true
jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Resolve exact pins
        id: pins
        env:
          STABLE_SHA_INPUT: ${{ inputs.stable_sha || '' }}
          DATALAB_SHA_INPUT: ${{ inputs.datalab_sha || '' }}
          SNAPSHOT_ID_INPUT: ${{ inputs.snapshot_id || '' }}
        shell: bash
        run: |
          set -euo pipefail
          # Refresh against current national bases on scheduled, push and pull_request runs.
          # Optional manual SHA pins allow an explicitly reproducible preview.
          if [[ "${{ github.event_name }}" != "workflow_dispatch" || -z "$STABLE_SHA_INPUT" ]]; then
            STABLE_SHA_INPUT="$(git ls-remote https://github.com/yass3705/tesla-charge-companion-stable.git refs/heads/main | cut -f1)"
          fi
          if [[ "${{ github.event_name }}" != "workflow_dispatch" || -z "$DATALAB_SHA_INPUT" ]]; then
            DATALAB_SHA_INPUT="$(git ls-remote https://github.com/yass3705/tesla-charge-companion-data-lab.git refs/heads/main | cut -f1)"
          fi
          if [[ -z "$SNAPSHOT_ID_INPUT" ]]; then
            SNAPSHOT_ID_INPUT="$(TZ=Europe/Paris date +%Y-%m-%d)-r${GITHUB_RUN_ID}"
          fi
          [[ "$STABLE_SHA_INPUT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$DATALAB_SHA_INPUT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SNAPSHOT_ID_INPUT" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}-r[0-9]+$ ]]
          echo "stable_sha=$STABLE_SHA_INPUT" >> "$GITHUB_OUTPUT"
          echo "datalab_sha=$DATALAB_SHA_INPUT" >> "$GITHUB_OUTPUT"
          echo "snapshot_id=$SNAPSHOT_ID_INPUT" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          path: production
      - uses: actions/checkout@v4
        with:
          repository: yass3705/tesla-charge-companion-stable
          ref: ${{ steps.pins.outputs.stable_sha }}
          path: stable
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: yass3705/tesla-charge-companion-data-lab
          ref: ${{ steps.pins.outputs.datalab_sha }}
          path: datalab
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Confirm UK Ubitricity support hold and verify newly audited Blink
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import gzip,json
          from pathlib import Path
          root=Path("datalab")
          collection=json.loads((root/"reports/uk/blink-pcpr-latest.json").read_text())
          audit=json.loads((root/"reports/uk/blink-pcpr-validation-latest.json").read_text())
          with gzip.open(root/"data/national/uk_blink_pcpr_v9.json.gz","rt",encoding="utf-8") as f:
              doc=json.load(f)
          assert doc["collectedAt"]==collection["collectedAt"]==audit["collectedAt"],"Blink source validation out of sync"
          assert audit["validatedForV9"] is True and audit["status"]=="validated_public_exact_connector"
          assert audit["exactPricedConnectors"]==audit["publicConnectors"]==3599
          assert audit["unpricedPublicConnectors"]==0
          assert audit["distinctTariffs"]==55 and audit["publicLocations"]==869
          print("BLINK_RECOLLECTED_VALIDATED",audit["collectedAt"],audit["exactPricedConnectors"])
          print("UBITRICITY_UK_SUPPORT_HOLD: no activation until support response")
          PY
      - name: Validate Gridserve public access and exact connector tariffs
        shell: bash
        run: |
          set -euo pipefail
          node production/tests/uk-gridserve-integration.test.mjs datalab/data/national/uk_gridserve_v9.json.gz
          python - <<'PY'
          import gzip, json
          from pathlib import Path
          p=Path("datalab")
          audit=json.loads((p/"reports/uk/gridserve-v9-integration-latest.json").read_text())
          with gzip.open(p/"data/national/uk_gridserve_v9.json.gz","rt",encoding="utf-8") as f:
              data=json.load(f)
          assert audit["status"]=="validated_public_connector_exact"
          assert audit["validatedForV9"] is True
          assert data["collectedAt"]==audit["collectedAt"]
          assert audit["exactPricedConnectors"]+audit["unpricedPublicConnectors"]==audit["publicConnectors"]
          assert audit["publicUnmappedTariffReferences"]==[]
          assert audit["publicLocations"]>=100 and audit["exactPricedConnectors"]>=1000
          print("Gridserve public-only V9 source validated",audit["publicLocations"],audit["exactPricedConnectors"])
          PY
      - name: Confirm unverified ChargePoint remains excluded from direct price ranking
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path("datalab/reports/uk/eco-movement-pcpr-v9-staging.json").read_text())
          assert report.get("readyForTariffRanking") is False
          print("CHARGEPOINT_UK_PAYG_PROOF_PENDING: excluded from direct prices")
          PY
      - name: Build and validate current global preview
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C stable rev-parse HEAD)" = "${{ steps.pins.outputs.stable_sha }}"
          test "$(git -C datalab rev-parse HEAD)" = "${{ steps.pins.outputs.datalab_sha }}"
          python production/scripts/build_refresh_candidate_config.py \
            --base production/config/snapshots/2026-10-06-r14-complete-left-join.json \
            --stable-sha "${{ steps.pins.outputs.stable_sha }}" \
            --datalab-sha "${{ steps.pins.outputs.datalab_sha }}" \
            --snapshot-id "${{ steps.pins.outputs.snapshot_id }}" \
            --use-stable-tesla-data --use-country-tesla-priority --use-datalab-nl \
            --out production/config/snapshots/global-mac-preview.json
          python production/scripts/validate_snapshot.py production/config/snapshots/global-mac-preview.json
          python production/scripts/validate_electra_platform_overlay.py datalab
          python production/scripts/build_snapshot.py --stable stable --datalab datalab \
            --config production/config/snapshots/global-mac-preview.json --out dist/v9-global-preview
          python production/scripts/validate_built_snapshot.py dist/v9-global-preview "${{ steps.pins.outputs.snapshot_id }}"
          cmp dist/v9-global-preview/runtime/data/tesla_stations.json dist/v9-global-preview/data/tesla_stations.json
          python production/scripts/validate_stable_parity.py stable dist/v9-global-preview --allow-nl-override --allow-country-tesla-priority --allow-pricing-engine-override
          python -m unittest discover -s production/tests -p 'test_tesla_tariff_priority.py'
          python production/scripts/validate_browser_asset_graph.py dist/v9-global-preview
          python production/scripts/verify_candidate_manifest.py dist/v9-global-preview
      - name: Check OCPI PCPR pricing precedence and cross-window safeguards
        run: node production/tests/uk-ocpi-first-match.test.mjs dist/v9-global-preview/runtime/assets/v9/pricing-engine.js
      - name: Verify UK exclusions, Blink and Midhope source in built V9 registry
        shell: bash
        run: |
          set -euo pipefail
          node production/tests/uk-midhope-verified-pricing.test.mjs
          node production/tests/uk-midhope-source-integration.test.mjs dist/v9-global-preview/snapshot-inputs/UK/sources/uk_connected_kerb_midhope_verified_v9.json.gz
          python - <<'PY'
          import json,gzip,hashlib
          from pathlib import Path
          dist=Path("dist/v9-global-preview")
          dl=Path("datalab")
          registry=json.loads((dist/"runtime/data/v9/source-registry.json").read_text())
          by_id={s["id"]:s for s in registry["sources"]}
          for sid in ("uk-ubitricity-pcpr-payg","uk-eco-movement-pcpr-cpo-direct"):
              assert by_id[sid]["active"] is False and by_id[sid]["optional"] is True,sid
          for sid in ("uk-blink-pcpr-direct","uk-connected-kerb-midhope-guest-verified"):
              assert by_id[sid]["active"] is True and by_id[sid]["optional"] is False,sid
          for file in ("uk_blink_pcpr_v9.json.gz","uk_connected_kerb_midhope_verified_v9.json.gz"):
              original=dl/"data/national"/file
              deployed=dist/"snapshot-inputs/UK/sources"/file
              assert deployed.exists() and hashlib.sha256(original.read_bytes()).digest()==hashlib.sha256(deployed.read_bytes()).digest(),file
          with gzip.open(dist/"snapshot-inputs/UK/sources/uk_blink_pcpr_v9.json.gz","rt") as f:
              blink=json.load(f)
          with gzip.open(dist/"snapshot-inputs/UK/sources/uk_connected_kerb_midhope_verified_v9.json.gz","rt") as f:
              ck=json.load(f)
          assert sum(len(e["connectors"]) for l in ck["sources"][0]["locations"] for e in l["evses"])==4
          assert sum(bool(c["tariff_ids"]) for l in blink["sources"][0]["locations"] for e in l["evses"] for c in e["connectors"])==3599
          print("UK_PRODUCTION_SCOPE_PASSED: Blink 3599, Midhope 4, Ubitricity/ChargePoint inactive")
          PY
      - name: Verify Gridserve is active and exact snapshot is deployed
        shell: bash
        run: |
          set -euo pipefail
          node production/tests/uk-gridserve-integration.test.mjs \
            datalab/data/national/uk_gridserve_v9.json.gz \
            dist/v9-global-preview/snapshot-inputs/UK/sources/uk_gridserve_v9.json.gz
          python - <<'PY'
          import json
          from pathlib import Path
          registry=json.loads(Path("dist/v9-global-preview/runtime/data/v9/source-registry.json").read_text())
          s=next(s for s in registry["sources"] if s.get("id")=="uk-gridserve-pcpr-direct")
          assert s["active"] is True and s["optional"] is False
          assert s["path"]=="../snapshot-inputs/UK/sources/uk_gridserve_v9.json.gz"
          print("Gridserve V9 registry active; exact public connector source deployed")
          PY
      - name: Validate Blink direct source and Midhope in actual built snapshot
        run: |
          node production/tests/uk-midhope-source-integration.test.mjs dist/v9-global-preview/snapshot-inputs/UK/sources/uk_connected_kerb_midhope_verified_v9.json.gz
          node production/tests/uk-ocpi-first-match.test.mjs dist/v9-global-preview/runtime/assets/v9/pricing-engine.js
      - name: Multi-country runtime smoke
        env:
          REQUIRE_ELECTRA_PLATFORM: "1"
        run: |
          node production/tests/v9-shell-grouping.test.mjs
          node production/tests/v9-tariff-lanes.test.mjs
          node production/tests/v9-ocpi-component-coverage.test.mjs dist/v9-global-preview
          node production/tests/v9-congestion-soc80.test.mjs dist/v9-global-preview
          python -m unittest discover -s production/tests -p "test_electra_direct_ocpi.py"
          node production/tests/offer-identity-index.test.mjs dist/v9-global-preview
          node production/tests/runtime-e2e-smoke.mjs dist/v9-global-preview
          node production/tests/national-snapshot-smoke.mjs dist/v9-global-preview
          node production/tests/electroverse-rich-pricing.test.mjs dist/v9-global-preview
      - name: Install browser test dependency
        run: npm install --no-save --no-package-lock playwright@1.55.1
      - name: Serve preview locally
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 --directory dist/v9-global-preview >/tmp/tcc-global-preview-server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/v9-production-shell/shell-config.json >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/tcc-global-preview-server.log
          exit 1
      - name: Browser journey
        run: node production/tests/runtime-browser-journey-global.mjs
      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload V9 global preview
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-attempt-${{ github.run_attempt }}
          path: dist/v9-global-preview
  deploy:
    if: github.event_name != 'pull_request'
    needs: build-deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy V9 global preview
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-attempt-${{ github.run_attempt }}
