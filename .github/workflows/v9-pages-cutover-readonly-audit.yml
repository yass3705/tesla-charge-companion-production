name: V9 GitHub Pages legacy cutover contract (read-only)
on:
  workflow_dispatch:
  pull_request:
    paths:
      - scripts/audit_pages_cutover_contract.py
      - .github/workflows/v9-pages-cutover-readonly-audit.yml
      - .github/workflows/publish-v9-pinned-pages.yml
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          path: production
      - uses: actions/checkout@v4
        with:
          repository: yass3705/tesla-charge-companion-stable
          ref: main
          path: stable
          persist-credentials: false
      - name: Audit publishing and rollback contracts
        run: |
          python production/scripts/audit_pages_cutover_contract.py --production-root production --stable-root stable --report report/pages-cutover.json
          cat report/pages-cutover.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pages-legacy-cutover-contract
          path: report/pages-cutover.json
          retention-days: 14
