name: Validate NL zero-priced rounding across tariff windows (no publish)
on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/validate-v9-nl-zero-price-step.yml"
      - "runtime-overrides/assets/v9/pricing-engine.js"
      - "runtime-overrides/assets/v9/adapters/netherlands-dotnl.js"
      - "tests/v9-nl-zero-price-step-midnight.test.mjs"
permissions:
  contents: read
jobs:
  pinned-dotnl:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Production PR (no publish)
        uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify targeted protection and existing Dutch regression
        run: |
          node tests/v9-nl-zero-price-step-midnight.test.mjs
          node tests/netherlands-dotnl-ocpi-pricing.test.mjs
          node tests/v9-pricing-time-zone.test.mjs
      - name: Checkout frozen Data Lab audit inputs
        uses: actions/checkout@v4
        with:
          repository: yass3705/tesla-charge-companion-data-lab
          ref: 8d0e94910f8125203bbf99435d8e141f4ee9875c
          path: datalab-pin
          persist-credentials: false
      - name: Simulate all six profiles with this Production PR engine
        env:
          TCC_PRODUCTION_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git -C datalab-pin rev-parse HEAD)" = "8d0e94910f8125203bbf99435d8e141f4ee9875c"
          python3 datalab-pin/scripts/v9_nl_direct_tariff_simulation_fixtures_20261012.py --output "$RUNNER_TEMP/nl-fixtures.json"
          node datalab-pin/scripts/v9_nl_direct_tariff_simulation_runtime_20261012.cjs "$RUNNER_TEMP/nl-fixtures.json" "$PWD" "$RUNNER_TEMP/nl-candidate-simulations.json"
          python3 - "$RUNNER_TEMP/nl-candidate-simulations.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          assert d['representedActiveCompiledConnectors']==161509
          assert d['weightedEvaluationCount']==969054
          assert d['independentOracleMismatchWeight']==0
          assert d['nonEurSourceCurrencyWeight']==24
          results={p['id']:p['results'] for p in d['profiles']}
          assert results['weekday_midnight']['completeWeight']>154834, "No supported improvement in midnight simulations"
          assert results['weekday_midnight']['incompleteWeight']<6675, "Midnight failures did not decrease"
          assert results['weekday_day']['completeWeight']==161485, "Unrelated daytime regression"
          assert results['weekday_evening_idle']['completeWeight']==161485, "Unrelated evening regression"
          assert results['sunday_idle']['completeWeight']==161485
          assert results['long_session']['completeWeight']==161485
          assert results['fall_dst_crossing']['completeWeight']==161485
          assert d['publishedToTcc'] is False
          print('NL candidate comparison:', {k:v['completeWeight'] for k,v in results.items()})
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v9-nl-zero-price-step-candidate-audit
          path: ${{ runner.temp }}/nl-candidate-simulations.json
          retention-days: 14
