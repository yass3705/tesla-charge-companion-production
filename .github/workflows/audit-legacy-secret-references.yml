name: Audit legacy secret references

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Scan public legacy repositories
        shell: bash
        run: |
          set -euo pipefail
          for repo in tesla-charge-companion-stable tesla-charge-companion-data-lab; do
            git clone --depth 1 "https://github.com/yass3705/${repo}.git" "${repo}"
          done
          echo "=== SECRET REFERENCES ==="
          grep -RhoE 'secrets\.[A-Za-z0-9_]+'             tesla-charge-companion-stable/.github/workflows             tesla-charge-companion-data-lab/.github/workflows             | sort -u
