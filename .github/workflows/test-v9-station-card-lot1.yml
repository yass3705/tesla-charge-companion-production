name: V9 station card Lot 1

on:
  pull_request:
    paths:
      - 'v9-production-shell/bridge.js'
      - 'tests/v9-station-card-lot1.test.mjs'
      - 'tests/v9-physical-site-identity-132.test.mjs'
      - 'tests/v9-station-card-browser.mjs'
      - '.github/workflows/test-v9-station-card-lot1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  station-card:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run targeted presentation and tariff tests
        run: node --test tests/v9-station-card-lot1.test.mjs tests/v9-physical-site-identity-132.test.mjs tests/v9-shell-grouping.test.mjs tests/v9-tariff-lanes.test.mjs tests/v9-tesla-global-layout.test.mjs
      - name: Install browser driver using system Chrome
        run: npm install --no-save --no-package-lock playwright@1.55.1
      - name: Check desktop and mobile card layouts
        run: node tests/v9-station-card-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v9-station-card-lot1-screenshots
          path: artifacts/station-card-*.png
          if-no-files-found: ignore
          retention-days: 14
