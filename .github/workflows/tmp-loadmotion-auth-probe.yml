name: Temporary Load Motion auth feasibility probe

on:
  push:
    paths:
      - ".github/workflows/tmp-loadmotion-auth-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe current Load Motion public client
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import requests,re,json,urllib.parse
          base="https://loadstations.load-motion.com/"
          h=requests.get(base,timeout=30)
          print("HOME",h.status_code,h.url)
          h.raise_for_status()
          scripts=[urllib.parse.urljoin(base,x) for x in re.findall(r"<script[^>]+src=[\"']([^\"']+)",h.text,re.I)]
          print("SCRIPTS",json.dumps(scripts))
          needles=[
            "REST_SIGN_IN","REST_GUESTS_REGISTER","REST_GUESTS_VERIFY_EMAIL",
            "REST_GUESTS_CHECK_CHARGING_STATION","refreshToken","refresh-token",
            "tokenGetter","restServerAuthURL","loginSucceeded","isTokenExpired",
            "guestRegisterUser","guestVerifyEmail","guestCheckChargingStation"
          ]
          alltxt=""
          for u in scripts:
            try:
              r=requests.get(u,timeout=45)
              print("ASSET",r.status_code,u,len(r.text))
              if r.status_code==200:
                alltxt += "\n/*ASSET "+u+"*/\n"+r.text
            except Exception as e:
              print("ASSET_ERR",u,repr(e))
          low=alltxt.lower()
          for nd in needles:
            pos=0
            found=0
            while True:
              i=low.find(nd.lower(),pos)
              if i<0:
                break
              found+=1
              ctx=alltxt[max(0,i-900):i+1800]
              print("\n===",nd,"HIT",found,"===\n",ctx[:3000])
              pos=i+len(nd)
              if found>=4:
                break
            if not found:
              print("\n===",nd,"NOT_FOUND===")
          lits=re.findall(r"[\"']([^\"']{1,220})[\"']",alltxt)
          keep=[]
          for s in lits:
            sl=s.lower()
            if any(k in sl for k in ["sign-in","signin","guest","verify-email","refresh","auth"]) and s not in keep:
              keep.append(s)
          print("\n=== AUTH_LITERALS ===")
          for s in keep[:300]:
            print(s)
          PY
