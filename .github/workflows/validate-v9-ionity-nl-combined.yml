name: Integrate verified DE IONITY provenance and NL rounding fixes (no publish)
on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/validate-v9-ionity-nl-combined.yml"
      - "runtime-overrides/assets/v9/pricing-engine.js"
      - "tests/v9-nl-zero-price-step-midnight.test.mjs"
      - "tests/v9-nl-invariant-rounding.test.mjs"
      - "scripts/build_germany_ionity_inventory_supplement.py"
      - "tests/test_germany_ionity_supplement_provenance.py"
permissions:
  contents: read
jobs:
  combined:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Ensure standalone fixes and old pricing tests still pass
        run: |
          node tests/v9-nl-zero-price-step-midnight.test.mjs
          node tests/v9-nl-invariant-rounding.test.mjs
          node tests/netherlands-dotnl-ocpi-pricing.test.mjs
          node tests/v9-pricing-time-zone.test.mjs
          python3 -m unittest discover -s tests -p 'test_germany_ionity_supplement_provenance.py'
      - uses: actions/checkout@v4
        with:
          repository: yass3705/tesla-charge-companion-data-lab
          ref: 8d0e94910f8125203bbf99435d8e141f4ee9875c
          path: datalab-pin
          persist-credentials: false
      - name: Replay all six Netherlands price profiles on combined candidate
        env:
          TCC_PRODUCTION_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git -C datalab-pin rev-parse HEAD)" = "8d0e94910f8125203bbf99435d8e141f4ee9875c"
          python3 datalab-pin/scripts/v9_nl_direct_tariff_simulation_fixtures_20261012.py --output "$RUNNER_TEMP/nl-fixtures.json"
          node datalab-pin/scripts/v9_nl_direct_tariff_simulation_runtime_20261012.cjs "$RUNNER_TEMP/nl-fixtures.json" "$PWD" "$RUNNER_TEMP/nl-combined-simulations.json"
          python3 - "$RUNNER_TEMP/nl-combined-simulations.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          assert d['representedActiveCompiledConnectors']==161509
          assert d['weightedEvaluationCount']==969054
          assert d['independentOracleMismatchWeight']==0
          assert d['nonEurSourceCurrencyWeight']==24
          p={v['id']:v['results'] for v in d['profiles']}
          assert p['weekday_midnight']['completeWeight']>=161475, "Two corrections did not combine as expected"
          for n in ('weekday_day','weekday_evening_idle','sunday_idle','long_session','fall_dst_crossing'):
            assert p[n]['completeWeight']==161485, "Regression in "+n
          assert d['publishedToTcc'] is False
          print('Combined candidate:',{n:v['completeWeight'] for n,v in p.items()})
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v9-ionity-nl-combined-simulation-audit
          path: ${{ runner.temp }}/nl-combined-simulations.json
          retention-days: 14
