name: V9 pinned snapshot development validation

on:
  workflow_dispatch:
  # Validate changes to the pinned development builder before they reach main.
  # This workflow has read-only permissions and no Pages or release steps.
  pull_request:
    paths:
      - ".github/workflows/v9-refresh-candidate-dry-run.yml"
      - "config/refresh-policy.json"
      - "config/germany-ionity-supplement-provenance.json"
      - "config/electra-legacy-source-provenance.json"
      - "scripts/build_snapshot.py"
      - "scripts/scope_belib_offers.py"
      - "tests/belib-exact-evse.test.mjs"
      - "scripts/compile_uk_direct_batch.py"
      - "tests/test_uk_geniepoint_tariff_choice.py"
      - "scripts/build_germany_ionity_inventory_supplement.py"
      - "scripts/validate_built_snapshot.py"
      - "tests/test_germany_ionity_supplement_provenance.py"
      - "tests/runtime-e2e-smoke.mjs"
      - "tests/runtime-browser-journey.mjs"
      - "tests/runtime-browser-journey-pinned-dev.mjs"
      - "runtime-overrides/assets/v9/**"
      - "tests/france-direct-offer-kind.test.mjs"
      - "tests/france-irve-power-units.test.mjs"
      - "scripts/audit_france_emsp_assignments.py"
      - "tests/v9-common-station-links.test.mjs"
      - "tests/v9-tesla-matosinhos-runtime.test.mjs"
      - "tests/v9-strict-ranking.test.mjs"
      - "tests/v9-electra-plus-direct.test.mjs"

      - "tests/v9-tesla-global-layout.test.mjs"
      - "tests/belgium-nap-safe-pricing.test.mjs"
      - "v9-production-shell/**"
  push:
    branches: [main]
    paths:
      - "config/refresh-policy.json"
      - ".github/workflows/v9-refresh-candidate-dry-run.yml"
      - "tests/runtime-browser-journey.mjs"
      - "tests/runtime-browser-journey-pinned-dev.mjs"
      - "runtime-overrides/assets/v9/**"
      - "tests/belgium-nap-safe-pricing.test.mjs"
      - "v9-production-shell/**"
      - "scripts/build_snapshot.py"
      - "scripts/scope_belib_offers.py"
      - "tests/belib-exact-evse.test.mjs"
      - "scripts/compile_uk_direct_batch.py"
      - "tests/test_uk_geniepoint_tariff_choice.py"
      - "scripts/build_germany_ionity_inventory_supplement.py"
      - "config/germany-ionity-supplement-provenance.json"
      - "config/electra-legacy-source-provenance.json"
      - "tests/test_germany_ionity_supplement_provenance.py"
      - "scripts/validate_built_snapshot.py"
      - "tests/runtime-e2e-smoke.mjs"

permissions:
  contents: read
  actions: read

concurrency:
  group: v9-pinned-snapshot-development-validation-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          path: production
      - name: Read immutable development pin
        id: pin
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          policy=json.load(open("production/config/refresh-policy.json", encoding="utf-8"))
          dev=policy["development"]
          snapshot_id=dev["currentSnapshot"]
          cfg=json.load(open(f"production/config/snapshots/{snapshot_id}.json", encoding="utf-8"))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"snapshot_id={snapshot_id}\n")
              out.write(f"datalab_sha={dev['dataLabSha']}\n")
              out.write(f"stable_sha={cfg['sources']['stable']['sha']}\n")
          PY
      - uses: actions/checkout@v4
        with:
          repository: yass3705/tesla-charge-companion-stable
          ref: ${{ steps.pin.outputs.stable_sha }}
          path: stable
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: yass3705/tesla-charge-companion-data-lab
          ref: ${{ steps.pin.outputs.datalab_sha }}
          path: datalab
          fetch-depth: 1
          persist-credentials: false

      - name: Validate future snapshot source-selection policy
        run: |
          python -m unittest discover -s production/tests -p test_snapshot_source_selection.py -v
          python -m unittest discover -s production/tests -p test_germany_ionity_supplement_provenance.py -v
          python -m unittest discover -s production/tests -p test_uk_geniepoint_tariff_choice.py -v

      - name: Verify immutable development snapshot pin
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C datalab rev-parse HEAD)" = "${{ steps.pin.outputs.datalab_sha }}"
          python production/scripts/validate_snapshot.py "production/config/snapshots/${{ steps.pin.outputs.snapshot_id }}.json"

      - name: Validate source-specific guards
        run: |
          python production/scripts/validate_electra_platform_overlay.py datalab
          python production/scripts/audit_france_emsp_assignments.py --stable stable --datalab datalab --min-electra-joined 92850 --min-electroverse-joined 86782
          node production/tests/belgium-nap-safe-pricing.test.mjs
          node production/tests/france-direct-offer-kind.test.mjs
          TCC_STABLE_ROOT=stable node production/tests/france-irve-power-units.test.mjs
          node production/tests/v9-common-station-links.test.mjs
          node production/tests/v9-electra-plus-direct.test.mjs

          node production/tests/v9-tesla-global-layout.test.mjs
          TCC_STABLE_ROOT=stable TCC_DATALAB_ROOT=datalab node production/tests/belib-exact-evse.test.mjs

      - name: Build self-contained refreshed candidate
        run: |
          cd production
          python scripts/build_snapshot.py --stable ../stable --datalab ../datalab --config "config/snapshots/${{ steps.pin.outputs.snapshot_id }}.json" --out ../dist/v9-dev-snapshot
          python scripts/validate_built_snapshot.py ../dist/v9-dev-snapshot "${{ steps.pin.outputs.snapshot_id }}"
          python scripts/validate_stable_parity.py ../stable ../dist/v9-dev-snapshot --allow-nl-override --allow-pricing-engine-override
          python scripts/validate_browser_asset_graph.py ../dist/v9-dev-snapshot
          node tests/belgium-nap-safe-pricing.test.mjs ../dist/v9-dev-snapshot/snapshot-inputs/BE/pages

      - name: Multi-country runtime smoke
        env:
          REQUIRE_ELECTRA_PLATFORM: "1"
          REQUIRE_BE: "1"
        run: |
          node production/tests/v9-pricing-time-zone.test.mjs
          node production/tests/v9-tariff-lanes.test.mjs
          node production/tests/v9-tesla-matosinhos-runtime.test.mjs dist/v9-dev-snapshot
          node production/tests/v9-strict-ranking.test.mjs
          node production/tests/v9-electra-plus-direct.test.mjs dist/v9-dev-snapshot

          node production/tests/v9-ocpi-component-coverage.test.mjs dist/v9-dev-snapshot
          node production/tests/v9-congestion-soc80.test.mjs dist/v9-dev-snapshot
          node production/tests/runtime-e2e-smoke.mjs dist/v9-dev-snapshot

      - name: Install browser test dependency
        run: npm install --no-save --no-package-lock playwright@1.55.1

      - name: Serve candidate locally
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 --directory dist/v9-dev-snapshot >/tmp/tcc-refresh-candidate-server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/v9-production-shell/shell-config.json >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/tcc-refresh-candidate-server.log
          exit 1

      - name: Mocked geocoding/routing browser journey
        run: node production/tests/runtime-browser-journey-pinned-dev.mjs

      - name: Verify candidate manifest hashes
        run: python production/scripts/verify_candidate_manifest.py dist/v9-dev-snapshot

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: v9-dev-snapshot-${{ steps.pin.outputs.snapshot_id }}
          path: |
            dist/v9-dev-snapshot
            /tmp/tcc-refresh-candidate-server.log
          retention-days: 7
          compression-level: 0

      - name: Explicit no-publish guard
        run: echo "Pinned development snapshot validated only. Data Lab main is not used for this build. No release, deployment, tag or production pin mutation is performed."
