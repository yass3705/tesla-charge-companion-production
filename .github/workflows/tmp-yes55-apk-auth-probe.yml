name: Temporary YES55 APK auth probe

on:
  push:
    paths:
      - '.github/workflows/tmp-yes55-apk-auth-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download and inspect YES55 package
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import requests,re,html,sys
          url='https://apkpure.net/yes55/com.loadstations.yes55/download'
          r=requests.get(url,timeout=40,headers={'User-Agent':'Mozilla/5.0'})
          print('PAGE',r.status_code,r.url,len(r.text))
          txt=html.unescape(r.text)
          pats=[r'https?://[^"\'<> ]+(?:xapk|apk)[^"\'<> ]*', r'https?://[^"\'<> ]*download[^"\'<> ]*']
          found=[]
          for p in pats:
            for x in re.findall(p,txt,re.I):
              if x not in found: found.append(x)
          for x in found[:80]: print('CAND',x)
          open('/tmp/page.html','w').write(txt)
          PY
          grep -Eio 'https?://[^"'"'"' <>]+' /tmp/page.html | grep -Ei 'xapk|apk|download' | head -80 || true
          url=$(grep -Eio 'https?://[^"'"'"' <>]+' /tmp/page.html | grep -Ei 'd\.apkpure|xapk|download' | head -1 || true)
          echo "CHOSEN=$url"
          if [ -n "$url" ]; then
            curl -L --fail --retry 2 -A 'Mozilla/5.0' "$url" -o /tmp/yes55.bin || true
            file /tmp/yes55.bin || true
            ls -lh /tmp/yes55.bin || true
            if unzip -t /tmp/yes55.bin >/dev/null 2>&1; then
              mkdir -p /tmp/yes55 && unzip -q /tmp/yes55.bin -d /tmp/yes55
              find /tmp/yes55 -maxdepth 2 -type f | head -50
              for f in $(find /tmp/yes55 -type f -name '*.apk'); do
                echo "APK=$f"
                strings "$f" | grep -Ei 'refresh.?token|signin|sign-in|guest|bearer|access.?token|jwt|/v1/auth|/v1/api' | head -200 || true
              done
            fi
          fi
