name: Transfer France IRVE Data Lab to Production candidate
on:
  pull_request:
    paths:
      - scripts/import_france_irve_from_datalab.py
      - .github/workflows/transfer-france-irve-datalab.yml
  workflow_dispatch:
    inputs:
      datalab_sha:
        description: "Optional exact 40-char Data Lab commit SHA (empty = latest for read-only comparison)"
        required: false
        type: string
permissions:
  contents: read
jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: production
      - uses: actions/checkout@v4
        with:
          repository: yass3705/tesla-charge-companion-data-lab
          ref: ${{ inputs.datalab_sha || 'main' }}
          path: datalab
          persist-credentials: false
      - name: Record and verify exact Data Lab source SHA
        env:
          REQUESTED_DATALAB_SHA: ${{ inputs.datalab_sha }}
        run: |
          set -euo pipefail
          actual="$(git -C datalab rev-parse HEAD)"
          if [ -n "${REQUESTED_DATALAB_SHA:-}" ]; then
            [[ "${REQUESTED_DATALAB_SHA}" =~ ^[a-fA-F0-9]{40}$ ]] || { echo "Invalid Data Lab SHA" >&2; exit 1; }
            test "${actual}" = "${REQUESTED_DATALAB_SHA}" || { echo "Data Lab pin mismatch" >&2; exit 1; }
          fi
          printf '%s\\n' "${actual}" > datalab-source-sha.txt
      - name: Import canonical France IRVE directly into Production runtime layout
        run: |
          python production/scripts/import_france_irve_from_datalab.py --datalab datalab --output candidate/v9-production-runtime/data/v9/france-static
          cp datalab-source-sha.txt candidate/source-datalab-sha.txt
          mkdir -p candidate/v9-test/data/v9
          cp -a candidate/v9-production-runtime/data/v9/france-static candidate/v9-test/data/v9/france-static
      - uses: actions/checkout@v4
        with:
          repository: yass3705/tesla-charge-companion-stable
          path: stable
          persist-credentials: false
      - name: Compare imported France bundle with current Stable V9 relay
        run: |
          python - <<'PY'
          import json,pathlib,hashlib
          source=pathlib.Path("candidate/v9-production-runtime/data/v9/france-static/manifest.json")
          prior=pathlib.Path("stable/v9-production-runtime/data/v9/france-static/manifest.json")
          a=json.loads(source.read_text());b=json.loads(prior.read_text())
          keys=("stationCount","pdcCount","sourceSha256","allSha256")
          comparison={k:{"datalab":a.get(k),"stable":b.get(k),"same":a.get(k)==b.get(k)} for k in keys}
          pathlib.Path("candidate/france-stable-parity.json").write_text(json.dumps(comparison,indent=2)+"\\n")
          print(json.dumps(comparison,indent=2))
          # The static source can legitimately refresh before Stable sync; mismatches
          # are retained for review, never silently overwritten or auto-promoted.
          PY
      - name: Assert both Production runtime and test bundles are identical
        run: |
          diff -r candidate/v9-production-runtime/data/v9/france-static candidate/v9-test/data/v9/france-static
          test -s candidate/source-datalab-sha.txt
      - name: Upload validated production-ready source bundle
        uses: actions/upload-artifact@v4
        with:
          name: production-france-irve-from-datalab
          path: candidate/
          retention-days: 14
