name: Build V9 2026-09-30 r8 candidate

on:
  push:
    paths:
      - "config/snapshots/2026-09-30-r8.json"
      - "scripts/build_snapshot.py"
      - "scripts/build_runtime_registry.py"
      - "scripts/validate_built_snapshot.py"
      - "runtime-overrides/**"
      - "tests/runtime-integration.test.mjs"
      - ".github/workflows/build-2026-09-30-r8.yml"
  workflow_dispatch:

concurrency:
  group: tcc-v9-r8-runtime-integration
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: production
      - name: Read metadata
        id: meta
        run: python production/scripts/export_snapshot_meta.py production/config/snapshots/2026-09-30-r8.json >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: ${{ steps.meta.outputs.stable_repo }}
          ref: ${{ steps.meta.outputs.stable_sha }}
          path: stable
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: ${{ steps.meta.outputs.datalab_repo }}
          ref: ${{ steps.meta.outputs.datalab_sha }}
          path: datalab
          persist-credentials: false
      - name: Verify canonical progress and durable Germany baseline
        run: |
          python - <<'PY'
          import json, pathlib
          dl=pathlib.Path("datalab")
          idx=json.load(open(dl/"docs/v9-country-progress-2026-09-30.json"))
          fr=idx["countries"]["FR"]["counters"]
          it=idx["countries"]["IT"]["counters"]
          assert fr == {"totalCpos":291,"treated":94,"setAside":27,"active":170}, fr
          assert it["currentPunPartyIds"]==92 and it["treated"]==26 and it["partialCurrent"]==66, it
          assert it["treated"]+it["partialCurrent"]==92
          de=dl/"data/national/germany_non_tesla_catalog_staging_direct_cpo.json.gz"
          dm=dl/"data/national/germany_non_tesla_catalog_staging_direct_cpo_manifest.json"
          assert de.exists() and de.stat().st_size>1_000_000, de
          assert dm.exists(), dm
          av=json.load(open(dl/"docs/switzerland-avia-guest-reconciliation-2026-09-29.json"))
          assert av["counts"]["matchedNationalEvseCount"]==583
          assert av["counts"]["missingNationalEvseCount"]==0
          print({"FR":fr,"IT":{"treated":26,"partial":66},"DE_durable_bytes":de.stat().st_size,"AVIA_CH":"583/583"})
          PY
      - name: Validate production runtime adapters
        run: node production/tests/runtime-integration.test.mjs

      - name: Build and validate r8
        run: |
          cd production
          python scripts/validate_snapshot.py config/snapshots/2026-09-30-r8.json
          python scripts/build_snapshot.py             --stable ../stable             --datalab ../datalab             --config config/snapshots/2026-09-30-r8.json             --out ../dist/v9-2026-09-30-r8
          python scripts/validate_built_snapshot.py ../dist/v9-2026-09-30-r8 2026-09-30-r8
          python scripts/validate_stable_parity.py ../stable ../dist/v9-2026-09-30-r8
      - name: Runtime DE/GB end-to-end smoke
        run: node production/tests/runtime-e2e-smoke.mjs dist/v9-2026-09-30-r8

      - uses: actions/upload-artifact@v4
        with:
          name: tcc-v9-2026-09-30-r8-candidate
          path: dist/v9-2026-09-30-r8
          compression-level: 0
          retention-days: 14
