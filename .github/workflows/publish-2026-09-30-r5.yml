name: Publish V9 2026-09-30 r5 release

on:
  push:
    paths:
      - ".github/workflows/publish-2026-09-30-r5.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production
        uses: actions/checkout@v4
        with:
          path: production

      - name: Read r5 metadata
        id: meta
        run: python production/scripts/export_snapshot_meta.py production/config/snapshots/2026-09-30-r5.json >> "$GITHUB_OUTPUT"

      - name: Checkout pinned stable baseline
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.meta.outputs.stable_repo }}
          ref: ${{ steps.meta.outputs.stable_sha }}
          path: stable
          persist-credentials: false

      - name: Checkout promotion-safe Data Lab head
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.meta.outputs.datalab_repo }}
          ref: ${{ steps.meta.outputs.datalab_sha }}
          path: datalab
          persist-credentials: false

      - name: Re-run guarded source floors
        run: |
          cd datalab
          python scripts/validate_v9_source_guards.py

      - name: Download pinned Germany national baseline
        env:
          GH_TOKEN: ${{ github.token }}
          ART_REPO: ${{ steps.meta.outputs.germany_artifact_repo }}
          ART_ID: ${{ steps.meta.outputs.germany_artifact_id }}
        run: |
          gh api "/repos/$ART_REPO/actions/artifacts/$ART_ID/zip" > /tmp/germany.zip
          mkdir -p germany-source
          unzip -q /tmp/germany.zip -d germany-source

      - name: Build and validate r5
        run: |
          cd production
          python scripts/validate_snapshot.py config/snapshots/2026-09-30-r5.json
          python scripts/build_snapshot.py             --stable ../stable             --datalab ../datalab             --germany-source ../germany-source             --config config/snapshots/2026-09-30-r5.json             --out ../dist/v9-2026-09-30-r5
          python scripts/validate_built_snapshot.py ../dist/v9-2026-09-30-r5 2026-09-30-r5
          python scripts/validate_stable_parity.py ../stable ../dist/v9-2026-09-30-r5

      - name: Verify AVIA and IONITY direct overlays
        run: |
          python - <<'PY'
          import gzip,json,pathlib
          root=pathlib.Path("dist/v9-2026-09-30-r5")
          av=json.load(open(root/"snapshot-inputs/CH/direct/avia-reconciliation.json"))
          assert av["counts"]["matchedNationalEvseCount"]==583
          assert av["counts"]["missingNationalEvseCount"]==0
          checks=[
            ("FR","snapshot-inputs/FR/direct/ionity_direct_stations_france.json.gz",181,1853),
            ("IT","snapshot-inputs/IT/direct/ionity_direct_stations_italy.json.gz",42,325),
            ("DE","snapshot-inputs/DE/direct/ionity_direct_stations_germany.json.gz",199,1578),
          ]
          for code,rel,sites,connectors in checks:
            with gzip.open(root/rel,"rt",encoding="utf-8") as f:
              d=json.load(f)
            c=d["counts"]
            assert c["countryLocationCount"]==sites,(code,c)
            assert c["countryConnectorCount"]==connectors,(code,c)
            assert c["countryUnpricedConnectorCount"]==0,(code,c)
          PY

      - name: Package
        run: |
          cd dist
          zip -0 -r tcc-v9-snapshot-2026-09-30-r5.zip v9-2026-09-30-r5 >/dev/null
          sha256sum tcc-v9-snapshot-2026-09-30-r5.zip | tee tcc-v9-snapshot-2026-09-30-r5.sha256

      - name: Publish persistent r5 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v9-snapshot-2026-09-30-r5"
          ZIP="dist/tcc-v9-snapshot-2026-09-30-r5.zip"
          SUM="dist/tcc-v9-snapshot-2026-09-30-r5.sha256"
          cat > /tmp/notes.md <<'EOF'
          Validated revision 5 of Tesla Charge Companion V9 snapshot 2026-09-30.

          Additions since r4:
          - AVIA Switzerland refresh path fixed end-to-end: targeted transient retries plus conflict-safe publication.
          - Latest accepted AVIA state: 583/583 national EVSE matched, zero missing; 587 guest-priced EVSEs visible.
          - IONITY France direct: 181 locations / 1,853 priced connectors / 0 unpriced.
          - IONITY Italy direct: 42 locations / 325 priced connectors / 0 unpriced.
          - IONITY Germany direct: 199 locations / 1,578 priced connectors / 0 unpriced.
          - Kilowatt snapshot validation aligned with its canonical station-level tariff overlay semantics.
          - Stable parity and historical baseline rebuild both pass.

          Previous releases remain preserved as rollback points.
          EOF
          if gh release view "$TAG" --repo yass3705/tesla-charge-companion-production >/dev/null 2>&1; then
            echo "Release already exists; refusing to mutate it."
            exit 0
          fi
          gh release create "$TAG" "$ZIP" "$SUM"             --repo yass3705/tesla-charge-companion-production             --title "TCC V9 snapshot — 2026-09-30 r5"             --notes-file /tmp/notes.md             --target "$GITHUB_SHA"
